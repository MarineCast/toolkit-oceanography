name: Research package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pip check
      - name: Verify scientific fixture codecs
        run: python -c "import h5py, numcodecs"
      - run: python -m pytest -q
      - run: oceanography --help
      - run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/dist"
      - name: Installed wheel smoke test
        run: |
          wheel_env="$RUNNER_TEMP/wheel-env"
          python -m venv "$wheel_env"
          for wheel in "$RUNNER_TEMP"/dist/*.whl; do
            "$wheel_env/bin/python" -m pip install "${wheel}[test]"
          done
          "$wheel_env/bin/python" -m pip check
          outside="$RUNNER_TEMP/wheel-smoke"
          workspace="$RUNNER_TEMP/oceanography-workspace"
          mkdir -p "$outside"
          cd "$outside"
          "$wheel_env/bin/python" - <<'PY'
          from importlib.resources import files

          import oceanography
          import oceanography.build
          import oceanography.glorys
          import oceanography.glorys_history
          import oceanography.liveocean
          import oceanography.waves_regional
          import oceanography.core.config

          from pathlib import Path
          import sys
          assert Path(oceanography.__file__).is_relative_to(Path(sys.prefix))

          root = files("oceanography")
          required = (
              "resources/config/common.yaml",
              "resources/config/data/environment_oceanographic.yaml",
              "resources/config/feature_catalog.yaml",
          )
          assert all(root.joinpath(*path.split("/")).is_file() for path in required)
          PY
          cp -R "$GITHUB_WORKSPACE/tests" "$outside/tests"
          cp -R "$GITHUB_WORKSPACE/config" "$outside/config"
          mkdir -p "$outside/src/oceanography"
          cp -R "$GITHUB_WORKSPACE/src/oceanography/resources" "$outside/src/oceanography/resources"
          "$wheel_env/bin/python" -m pytest -q tests
          "$wheel_env/bin/oceanography" --help
          "$wheel_env/bin/oceanography" init --workspace "$workspace"
          test -f "$workspace/config/common.yaml"
      - run: git diff --check
