[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-oceanography"
version = "0.1.0.dev0"
description = "Incomplete research pipelines for ocean conditions and marine influence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "geopandas>=1", "h3>=4", "numpy>=1.26", "pandas>=2.1", "pyarrow>=14",
  "pydantic>=2", "pyproj>=3.6", "PyYAML>=6", "requests>=2.31", "urllib3>=2",
  "scipy>=1.11", "shapely>=2", "xarray>=2024.1", "netCDF4>=1.6",
]

[project.optional-dependencies]
tides = ["utide==0.3.1"]
test = ["pytest>=8"]

[project.scripts]
oceanography = "oceanography.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oceanography = ["resources/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
