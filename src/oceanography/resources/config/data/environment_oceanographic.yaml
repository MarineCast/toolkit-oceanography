# Environmental research inputs; prey is a separate domain.
schema_version: 1
area: model_area
raw_dir: data/raw/environment/oceanographic
processed_dir: data/processed/domain/environmental_layer/oceanographic
report_dir: outputs/domains/environmental_layer/oceanographic
support_dir: data/processed/domain/environmental_layer/seascape/spatial_support
satellite_base: https://polarwatch.noaa.gov/erddap
salish_base: https://salishsea.eos.ubc.ca/erddap
current_u_dataset: ubcSSg3DuGridFields1hV21-11
current_v_dataset: ubcSSg3DvGridFields1hV21-11
current_geometry_dataset: ubcSSnBathymetryV21-08
offshore_current_base: https://ncss.hycom.org/thredds/ncss/grid/GLBy0.08/expt_93.0/uv3z
tide_model_url: https://www.bio.gc.ca/science/research-recherche/ocean/webtide/Application/Install/InstData/Data/Unix/WebTide_ne_pac_data_0_7.sh
current_interval_hours: 4
# Sensitivity candidates, not calibrated transport distances. Kernels stop at 3 scales.
tide_decay_km: [20, 40]
river_decay_km: [10, 25, 50]
kernel_cutoff_multiples: 3
seed_snap_max_km: 8
seed_shore_tolerance_m: 100
mouth_coast_snap_max_m: 1000
tide_coast_snap_max_m: 200
productivity_window_days: 7
productivity_min_valid_days: 1
min_tide_samples: 24
satellites:
  ocean_temperature:
    dataset: noaacwLEOACSPOSSTL3SCDaily
    variable: sea_surface_temperature
    units: degree_C
    resolution: 6
    quality_variable: quality_level
    quality_min: 4
    interpretation: Satellite surface temperature; retain quality levels 4 and 5. Cloud and coastal gaps remain missing.
  productivity:
    dataset: noaacwNPPVIIRSSQchlaDaily
    variable: chlor_a
    units: mg m^-3
    resolution: 5
    altitude: true
    interpretation: Science-quality satellite chlorophyll biomass proxy, not primary production or prey. No gap filling.
tides:
  - {provider: CHS, station: '07120'} # Victoria
  - {provider: CHS, station: '07735'} # Vancouver
  - {provider: CHS, station: '07590'} # Tsawwassen
  - {provider: CHS, station: '07895'} # Mitlenatch
  - {provider: NOAA, station: '9443090'} # Neah Bay
  - {provider: NOAA, station: '9444900'} # Port Townsend
  - {provider: NOAA, station: '9447130'} # Seattle
  - {provider: NOAA, station: '9449424'} # Cherry Point
  - {provider: NOAA, station: '9449880'} # Friday Harbor
